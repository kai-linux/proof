[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proof"
version = "0.1.0"
description = "A lightweight evaluation and reliability harness for agentic LLM systems."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Kai Libicher", email = "kai.libicher@gmail.com" },
]
keywords = ["llm", "evaluation", "benchmarking", "reliability", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
openai = ["openai>=1.50.0"]
all = ["anthropic>=0.40.0", "openai>=1.50.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
proof = "proof.cli:main"

[project.urls]
Homepage = "https://github.com/kai-linux/proof"
Repository = "https://github.com/kai-linux/proof"
Issues = "https://github.com/kai-linux/proof/issues"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
